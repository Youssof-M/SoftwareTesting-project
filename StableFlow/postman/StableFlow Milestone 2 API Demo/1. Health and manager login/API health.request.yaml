$kind: http-request
url: "{{baseUrl}}/health"
method: GET
scripts:
  - type: beforeRequest
    code: pm.environment.set('runId', Date.now().toString());
    language: text/javascript
  - type: afterResponse
    code: pm.test('API is healthy', () => pm.response.to.have.status(200));
    language: text/javascript
order: 1000
