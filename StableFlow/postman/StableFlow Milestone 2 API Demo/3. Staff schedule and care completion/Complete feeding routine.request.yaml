$kind: http-request
url: "{{baseUrl}}/routines/{{routineId}}/complete"
method: POST
headers:
  Authorization: Bearer {{staffToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "date": "{{demoDate}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('Care completion is recorded', () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
