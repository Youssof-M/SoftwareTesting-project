$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{staffEmail}}",
      "password": "{{staffPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Staff can sign in', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.environment.set('staffToken', body.token);
      pm.environment.set('staffId', body.user.staffId);
      pm.test('Staff role is returned', () => pm.expect(body.user.role).to.eql('staff'));
    language: text/javascript
order: 1000
