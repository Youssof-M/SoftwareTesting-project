$kind: http-request
url: "{{baseUrl}}/activities"
method: POST
headers:
  Authorization: Bearer {{managerToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "horseId": "{{horseId}}",
      "type": "Training",
      "date": "{{demoDate}}",
      "time": "16:30",
      "staffId": "{{staffId}}",
      "facility": "Postman Clinic {{runId}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('Overlapping booking is rejected', () => pm.response.to.have.status(409));
    language: text/javascript
order: 2000
