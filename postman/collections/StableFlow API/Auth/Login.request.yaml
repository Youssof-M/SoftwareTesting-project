$kind: http-request
name: Login
method: POST
url: 'http://localhost:5000/api/auth/login'
order: 3000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "manager@stableflow.demo",
      "password": "{{managerPassword}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      if (res.token) {
        pm.collectionVariables.set('auth_token', res.token);
        console.log('✅ auth_token saved');
      }
