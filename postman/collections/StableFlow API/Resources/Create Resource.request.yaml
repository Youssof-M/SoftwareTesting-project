$kind: http-request
name: Create Resource
method: POST
url: '{{base_url}}/resources'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Saddle",
      "category": "Equipment",
      "availability": "Available"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      if (res._id) {
        pm.collectionVariables.set('resource_id', res._id);
        console.log('✅ resource_id saved:', res._id);
      }