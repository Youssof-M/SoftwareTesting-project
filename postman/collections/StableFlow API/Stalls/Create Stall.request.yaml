$kind: http-request
name: Create Stall
method: POST
url: '{{base_url}}/stalls'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Stall A1",
      "location": "North Barn",
      "status": "Available"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      if (res._id) {
        pm.collectionVariables.set('stall_id', res._id);
        console.log('✅ stall_id saved:', res._id);
      }